<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HanBot · 聊天</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f5f4; color: #1c1917; margin: 0; }
  #topbar { background: #fff; border-bottom: 1px solid #e7e5e4; padding: 0.6rem 1rem;
            display: flex; gap: 1rem; align-items: center; }
  #topbar h1 { font-size: 1rem; margin: 0; }
  #topbar a { font-size: 0.85rem; color: #57534e; text-decoration: none; margin-left: auto; }
  #wrap { display: flex; height: calc(100vh - 3rem); }
  #sidebar { width: 15rem; background: #fff; border-right: 1px solid #e7e5e4; padding: 0.75rem;
             overflow-y: auto; }
  #sidebar .session { padding: 0.5rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sidebar .session:hover { background: #f5f5f4; }
  #sidebar .session.active { background: #e7e5e4; }
  #newBtn { width: 100%; padding: 0.4rem; margin-bottom: 0.75rem; border: none; border-radius: 4px;
            background: #1c1917; color: #fff; cursor: pointer; }
  #chat { flex: 1; display: flex; flex-direction: column; }
  #msgs { flex: 1; overflow-y: auto; padding: 1rem; }
  .msg { max-width: 46rem; margin: 0 auto 0.9rem; padding: 0.6rem 0.9rem; border-radius: 8px;
         font-size: 0.95rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: #1c1917; color: #fff; }
  .msg.assistant { background: #fff; border: 1px solid #e7e5e4; }
  .msg .tooluse, .msg .toolresult { font-family: ui-monospace, monospace; font-size: 0.8rem;
         color: #57534e; display: block; margin-top: 0.4rem; }
  .msg .tooluse { color: #92400e; }
  .msg .toolresult.err { color: #b91c1c; }
  #inputbar { display: flex; gap: 0.5rem; padding: 0.75rem; background: #fff;
              border-top: 1px solid #e7e5e4; }
  #input { flex: 1; padding: 0.55rem; border: 1px solid #d6d3d1; border-radius: 6px;
          font-size: 0.95rem; resize: none; }
  #sendBtn { padding: 0 1.1rem; border: none; border-radius: 6px; background: #1c1917;
             color: #fff; cursor: pointer; }
  #sendBtn:disabled { background: #a8a29e; }
  .cursor { display: inline-block; width: 7px; height: 1em; background: #57534e;
            vertical-align: text-bottom; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="topbar">
  <h1>HanBot</h1>
  <button id="logoutBtn" class="hidden" style="display:none">登出</button>
  <a href="/settings">API 源配置 →</a>
</div>
<div id="wrap">
  <div id="sidebar">
    <button id="newBtn">＋ 新会话</button>
    <div id="sessionList"></div>
  </div>
  <div id="chat">
    <div id="msgs"></div>
    <div id="inputbar">
      <textarea id="input" rows="2" placeholder="输入消息，Ctrl+Enter 发送"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const headers = Object.assign(
    { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" },
    opts.headers || {}
  );
  const resp = await fetch(path, Object.assign({}, opts, { headers }));
  if (resp.status === 401) location.href = "/";
  return { status: resp.status, body: await resp.json().catch(() => ({})) };
}

function esc(s) {
  return String(s).replace(/[&<>"']/g,
    (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

let sessionUuid = null;
let ws = null;
let streaming = null; // 流式中的 DOM 节点

function renderBlocks(blocks, into) {
  for (const b of blocks) {
    if (b.type === "text") into.textContent = b.text;
    else if (b.type === "tool_use") {
      const d = document.createElement("span");
      d.className = "tooluse";
      d.textContent = `[工具 ${b.name}] ${JSON.stringify(b.input)}`;
      into.appendChild(d);
    } else if (b.type === "tool_result") {
      const d = document.createElement("span");
      d.className = "toolresult" + (b.is_error ? " err" : "");
      d.textContent = `[结果] ${String(b.content).slice(0, 3000)}`;
      into.appendChild(d);
    }
  }
}

function appendMsg(role, blocks) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  renderBlocks(blocks, div);
  $("msgs").appendChild(div);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return div;
}

async function loadSessions() {
  const { body } = await api("/api/sessions");
  const list = $("sessionList");
  list.innerHTML = "";
  for (const s of body.sessions || []) {
    const d = document.createElement("div");
    d.className = "session" + (s.uuid === sessionUuid ? " active" : "");
    d.textContent = s.title || "未命名会话";
    d.onclick = () => openSession(s.uuid);
    list.appendChild(d);
  }
}

async function openSession(uuid) {
  sessionUuid = uuid;
  $("msgs").innerHTML = "";
  const { body } = await api(`/api/sessions/${uuid}/messages`);
  for (const m of body.messages || []) appendMsg(m.role, m.blocks);
  loadSessions();
  connectWs();
}

function connectWs() {
  if (ws) { ws.onclose = null; ws.close(); }
  ws = new WebSocket(`ws://${location.host}/ws?session=${sessionUuid}`);
  ws.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    if (ev.type === "message_delta") {
      if (!streaming) streaming = appendMsg("assistant", [{ type: "text", text: "" }]);
      streaming.textContent += ev.delta;
      $("msgs").scrollTop = $("msgs").scrollHeight;
    } else if (ev.type === "message_done") {
      if (streaming) { streaming = null; }
      // done 后重拉消息，保证 tool_use/tool_result 块渲染完整
      openSession(sessionUuid);
    } else if (ev.type === "error") {
      if (streaming) streaming = null;
      openSession(sessionUuid);
    }
  };
  ws.onclose = () => { if (sessionUuid) setTimeout(connectWs, 1500); };
}

async function send() {
  const content = $("input").value.trim();
  if (!content || !sessionUuid) return;
  $("input").value = "";
  appendMsg("user", [{ type: "text", text: content }]);
  const div = document.createElement("div");
  div.className = "msg assistant";
  const cur = document.createElement("span");
  cur.className = "cursor";
  div.appendChild(cur);
  $("msgs").appendChild(div);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  const { status, body } = await api(`/api/sessions/${sessionUuid}/chat`, {
    method: "POST", body: JSON.stringify({ content }),
  });
  if (status !== 200) { cur.remove(); appendMsg("assistant", [{ type: "text", text: "发送失败：" + (body.detail || status) }]); }
}

$("sendBtn").addEventListener("click", send);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
$("newBtn").addEventListener("click", async () => {
  const { body } = await api("/api/sessions", { method: "POST", body: JSON.stringify({ title: "新会话 " + new Date().toLocaleString() }) });
  await loadSessions();
  openSession(body.uuid);
});
$("logoutBtn").addEventListener("click", async () => {
  await api("/api/auth/logout", { method: "POST" });
  location.href = "/";
});

(async () => {
  const { body } = await api("/api/auth/session");
  if (body.logged_in !== true) { location.href = "/"; return; }
  $("logoutBtn").style.display = "";
  await loadSessions();
  const first = document.querySelector(".session");
  if (first) openSession(first.className.includes("active") ? sessionUuid : (await pickFirst()));
  async function pickFirst() {
    const { body } = await api("/api/sessions");
    const s = (body.sessions || [])[0];
    if (s) { openSession(s.uuid); return s.uuid; }
    return null;
  }
})();
</script>
</body>
</html>
