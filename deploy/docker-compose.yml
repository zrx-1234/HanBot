services:
  backend:
    build:
      context: ../backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    environment:
      HANBOT_SECRET: ${HANBOT_SECRET:-dev-secret-change-me}
      HANBOT_USERNAME: ${HANBOT_USERNAME:-han}
      HANBOT_INITIAL_PASSWORD: ${HANBOT_INITIAL_PASSWORD:-dev-password}
      HANBOT_DATA_DIR: /data
      HANBOT_DB_PATH: /data/db/hanbot.db
      HANBOT_SECURE_COOKIES: ${HANBOT_SECURE_COOKIES:-true}
    volumes:
      - ../data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      HANBOT_DOMAIN: ${HANBOT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.dev:/etc/caddy/Caddyfile.dev:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
