services:
  backend:
    build:
      context: ../backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    # 固定内网 IP：只信任来自 caddy 的 X-Forwarded-For，其余一律当直连处理
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.28.0.20
    environment:
      # 生产必填（dev 由 docker-compose.dev.yml 关闭强校验）
      HANBOT_SECRET: ${HANBOT_SECRET:?在 deploy/.env 中设置}
      HANBOT_USERNAME: ${HANBOT_USERNAME:-han}
      HANBOT_INITIAL_PASSWORD: ${HANBOT_INITIAL_PASSWORD:?在 deploy/.env 中设置}
      # 数据加密主密钥——M2 起 compose 一直漏传此变量（容器实际用 dev 兜底值加密），
      # M1.5 准备时发现并修复；存量密文已一次性迁移到真 key
      HANBOT_DATA_KEY: ${HANBOT_DATA_KEY:?在 deploy/.env 中设置}
      HANBOT_DATA_DIR: /data
      HANBOT_DB_PATH: /data/db/hanbot.db
      HANBOT_SECURE_COOKIES: ${HANBOT_SECURE_COOKIES:-true}
    volumes:
      # Linux 生产机上此目录需可被 uid 1000 写入（chown -R 1000:1000 data/）
      - ../data:/data
    networks:
      - hanbot_net
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      HANBOT_DOMAIN: ${HANBOT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.dev:/etc/caddy/Caddyfile.dev:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # 本机 80 端口被同机其他服务（family-server-nginx）占用：生产只发布 443。
      # 证书签发走 TLS-ALPN-01（仅依赖 443），不走 HTTP-01（需 80）。
      # 代价：http:// 明文访问不会被重定向到 https——单用户直接用 https:// 即可。
      - "443:443"
      - "443:443/udp" # HTTP/3
    networks:
      hanbot_net:
        ipv4_address: 172.28.0.20
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  hanbot_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
