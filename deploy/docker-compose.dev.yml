services:
  backend:
    volumes:
      - ../backend:/app
    environment:
      # dev 走本地 http，关闭强校验；.env 仍需存在（base 文件里密钥是必填项）
      HANBOT_SECURE_COOKIES: "false"

  caddy:
    # dev 只走本地 HTTP，不发布 443。
    # 宿主 80 已被同机其他服务占用（family-server-nginx），dev 固定用 8081。
    command: caddy run --config /etc/caddy/Caddyfile.dev --adapter caddyfile
    ports: !override
      - "8081:80"
