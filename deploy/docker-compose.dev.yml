services:
  backend:
    volumes:
      - ../backend:/app
    environment:
      # dev 走本地 http，关闭强校验；.env 仍需存在（base 文件里密钥是必填项）
      HANBOT_SECURE_COOKIES: "false"

  caddy:
    # dev 只走 :80 的本地 HTTP 配置，不发布 443
    command: caddy run --config /etc/caddy/Caddyfile.dev --adapter caddyfile
    ports: !override
      - "80:80"
